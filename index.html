<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WHOPPER • ПВЗ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .role-container {
            max-width: 500px;
            width: 100%;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            padding: 40px;
            text-align: center;
        }
        h1 {
            color: #f5a623;
            font-size: 2rem;
            margin-bottom: 10px;
        }
        .sub {
            color: #ccc;
            margin-bottom: 40px;
        }
        .role-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .role-btn {
            padding: 18px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.2s;
        }
        .role-btn:active {
            transform: scale(0.97);
        }
        .client { background: #4CAF50; color: white; }
        .staff { background: #f5a623; color: #1a1a2e; }
        .courier { background: #2196F3; color: white; }
        .role-btn:hover {
            opacity: 0.9;
        }
        .footer {
            margin-top: 30px;
            color: #888;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="role-container">
        <h1>🍔 WHOPPER BAR</h1>
        <div class="sub">Пункт выдачи заказов</div>
        <div class="role-buttons">
            <button class="role-btn client" onclick="goTo('client')">📱 Я КЛИЕНТ</button>
            <button class="role-btn staff" onclick="goTo('staff')">🛒 СОТРУДНИК ПВЗ</button>
            <button class="role-btn courier" onclick="goTo('courier')">🚚 КУРЬЕР</button>
        </div>
        <div class="footer">Выберите вашу роль</div>
    </div>

    <script>
        function goTo(role) {
            if (role === 'client') window.location.href = 'client.html';
            if (role === 'staff') window.location.href = 'staff.html';
            if (role === 'courier') window.location.href = 'courier.html';
        }
    </script>
</body>
</html>
